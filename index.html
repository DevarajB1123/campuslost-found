:var(--green2);font-size:12px;font-weight:800;padding:5px}.progress{height:7px;background:#edf1ed;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:#39875b;border-radius:10px}.progress-row{display:flex;justify-content:space-between;font-size:12px;margin:12px 0 7px}.muted{color:var(--muted)}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.filters input,.filters select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;outline:none;min-width:0}.filters input{flex:1;min-width:180px}.filters select{min-width:130px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:750}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:90px;resize:vertical}.empty{padding:30px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.quiz-option{display:block;width:100%;text-align:left;border:1px solid var(--line);background:white;padding:13px;border-radius:11px;margin:8px 0}.quiz-option:hover{border-color:#6fa685}.quiz-option.selected{border-color:var(--green2);background:var(--mint)}.quiz-option.correct{border-color:#2e8a51;background:#e7f7eb}.quiz-option.wrong{border-color:#c95b54;background:#fff0ee}.notice{background:#fff8e7;border:1px solid #f0dfae;border-radius:12px;padding:12px 14px;font-size:12px;color:#6e581b;margin:14px 0}.footer{text-align:center;color:#8a968f;font-size:11px;margin-top:35px}.modal-backdrop{position:fixed;inset:0;background:#12251c70;display:none;place-items:center;padding:20px;z-index:50}.modal-backdrop.show{display:grid}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:23px;box-shadow:0 30px 100px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0}.close{border:0;background:#f1f4f1;border-radius:9px;padding:7px 10px}.toast{position:fix const initial={news:[{id:1,title:'Karnataka-focused current affairs: daily briefing',kn:'ಕರ್ನಾಟಕದ ಪ್ರಮುಖ ಸುದ್ದಿಗಳ ದೈನಂದಿನ ಸಂಕ್ಷಿಪ್ತ ವರದಿ.',summary:'A sample exam-focused briefing format. Replace this demonstration entry with a verified daily summary and source link.',source:'NammaPrep Editorial',date:'2026-10-10',category:'Karnataka',exams:['KPSC','KAS'],demo:true},{id:2,title:'Understanding public finance and the Union Budget',kn:'ಸಾರ್ವಜನಿಕ ಹಣಕಾಸು ಮತ್ತು ಕೇಂದ್ರ ಬಜೆಟ್ ಪರಿಚಯ.',summary:'Revision focus: revenue receipts, capital expenditure, fiscal deficit and the role of public finance.',source:'NammaPrep Learning Desk',date:'2026-10-09',category:'Economy',exams:['KPSC','UPSC'],demo:true}],notes:[{id:1,title:'Indian Constitution: Fundamental Rights',subject:'Polity',source:'NCERT / official constitutional references',level:'Foundation',language:'English',summary:'Understand the meaning of Fundamental Rights, their purpose and key constitutional provisions. Verify article-level details against an authoritative source.',tags:['KPSC','UPSC'],demo:true},{id:2,title:'Karnataka Geography: Physical Divisions',subject:'Karnataka GK',source:'Karnataka State Board textbook reference',level:'Foundation',language:'Kannada + English',summary:'Study the major physical regions of Karnataka, climate patterns, rivers and their significance. Add chapter and page references after checking the source textbook.',tags:['KPSC','PDO','VAO'],demo:true},{id:3,title:'Indian History: The National Movement',subject:'History',source:'NCERT textbook reference',level:'Foundation',language:'English',summary:'Build a timeline of important events and understand causes, leaders and outcomes using the relevant textbook chapter.',tags:['KPSC','UPSC','SSC'],demo:true},{id:4,title:'ಭಾರತದ ಭೂಗೋಳ — ಮೂಲಭೂತ ಅಂಶಗಳು',subject:'Geography',source:'NCERT / ಕರ್ನಾಟಕ ಪಠ್ಯಪುಸ್ತಕ ಉಲ್ಲೇಖ',level:'Foundation',language:'Kannada',summary:'ಭಾರತದ ಭೌತಿಕ ವಿಭಾಗಗಳು, ಹವಾಮಾನ, ನದಿಗಳು ಮತ್ತು ನೈಸರ್ಗಿಕ ಸಂಪನ್ಮೂಲಗಳ ಕುರಿತು ಮೂಲಭೂತ ಅಂಶಗಳನ್ನು ಅಧ್ಯಯನ ಮಾಡಿ. ಅಧಿಕೃತ ಪಠ್ಯಪುಸ್ತಕದೊಂದಿಗೆ ವಿವರಗಳನ್ನು ಪರಿಶೀಲಿಸಿ.',tags:['KPSC','KAS'],demo:true}],jobs:[{id:1,title:'KPSC recruitment updates',org:'Karnataka Public Service Commission',status:'Verify official notice',deadline:'Check official notification',link:'https://kpsc.kar.nic.in/',description:'Visit the official KPSC website for current recruitment notices, eligibility, application dates and amendments.',demo:true},{id:2,title:'Karnataka Examination Authority updates',org:'KEA',status:'Official source link',deadline:'Check official notification',link:'https://cetonline.karnataka.gov.in/kea/',description:'Check the official KEA portal for recruitment and examination announcements.',demo:true},{id:3,title:'Union Public Service Commission',org:'UPSC',status:'Official source link',deadline:'Check official notification',link:'https://upsc.gov.in/',description:'Use the official UPSC website for notifications, examination calendars and results.',demo:true}],papers:[{id:1,title:'KPSC General Studies — Model Practice Set',exam:'KPSC',year:'Model',subject:'General Studies',language:'English',type:'MQP',description:'Original demonstration practice set. Not an official previous-year paper.',demo:true},{id:2,title:'Karnataka GK — Revision Question Set',exam:'KPSC / PDO',year:'Model',subject:'Karnataka GK',language:'Kannada + English',type:'MQP',description:'Sample revision set; replace with verified and authorized papers before launch.',demo:true}],quizzes:[{id:1,title:'Daily General Knowledge',subject:'General Knowledge',exam:'KPSC',questions:[{q:'Which part of the Indian Constitution contains Fundamental Rights?',opts:['Part I','Part II','Part III','Part IV'],a:2,exp:'Fundamental Rights are contained in Part III of the Constitution. Verify constitutional provisions using an authoritative source.'},{q:'Which is the capital of Karnataka?',opts:['Mysuru','Bengaluru','Belagavi','Kalaburagi'],a:1,exp:'Bengaluru is the capital of Karnataka.'},{q:'Which planet is known as the Red Planet?',opts:['Venus','Mars','Jupiter','Mercury'],a:1,exp:'Mars is commonly called the Red Planet because of iron oxide on its surface.'},{q:'Which institution publishes the Economic Survey of India?',opts:['Election Commission','Ministry of Finance','Supreme Court','NITI Aayog alone'],a:1,exp:'The Economic Survey is presented by the Ministry of Finance, Government of India.'},{q:'What does GDP measure?',opts:['Population only','Total value of final goods and services produced','Government tax only','Exports only'],a:1,exp:'GDP measures the value of final goods and services produced within an economy over a period.'}],demo:true},{id:2,title:'Karnataka GK Quick Test',subject:'Karnataka GK',exam:'KPSC / PDO',questions:[{q:'Which city is the capital of Karnataka?',opts:['Hubballi','Mangaluru','Bengaluru','Shivamogga'],a:2,exp:'Bengaluru is Karnataka’s capital.'},{q:'Which language is the official language of Karnataka?',opts:['Tamil','Kannada','Telugu','Marathi'],a:1,exp:'Kannada is the official language of Karnataka.'},{q:'Which of these is a major river associated with Karnataka?',opts:['Kaveri','Yamuna only','Sutlej','Brahmaputra'],a:0,exp:'The Kaveri is one of the major rivers associated with Karnataka.'}],demo:true}]};
let data=loadData(),page='home',lang=localStorage.getItem('np-lang')||'en',quizState=null,adminTab='content',plannerTasks=JSON.parse(localStorage.getItem('np-tasks')||'[]'),bookmarks=JSON.parse(localStorage.getItem('np-bookmarks')||'[]');
function loadData(){try{let s=localStorage.getItem('np-data');return s?JSON.parse(s):structuredClone(initial)}catch(e){return structuredClone(initial)}}function save(){localStorage.setItem('np-data',JSON.stringify(data))}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}function navRender(){let groups=[NAV.slice(0,8),NAV.slice(8)];['sideNav','sideNav2'].forEach((id,i)=>document.getElementById(id).innerHTML=groups[i].map(n=>`<button class="${page===n[0]?'active':''}" data-page="${n[0]}"><span class="ico">${n[1]}</span>${n[2]}</button>`).join(''));document.getElementById('bottomNav').innerHTML=[NAV[0],NAV[3],NAV[4],NAV[10]].map(n=>`<button class="${page===n[0]?'active':''}" data-page="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join('')}
function go(p){page=p;quizState=null;navRender();render();document.getElementById('globalSearch').value='';document.querySelector('.sidebar').classList.remove('mobile-open')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page);let act=e.target.closest('[data-action]');if(act)action(act.dataset.action,act.dataset.id,act.dataset.kind)});
document.getElementById('languageSelect').value=lang;document.getElementById('languageSelect').addEventListener('change',e=>{lang=e.target.value;localStorage.setItem('np-lang',lang);render();toast(lang==='kn'?'ಭಾಷೆ ಬದಲಾಯಿಸಲಾಗಿದೆ':'Language preference updated')});document.getElementById('globalSearch').addEventListener('input',e=>{let q=e.target.value.trim();if(q){page='search';navRender();renderSearch(q)}});document.getElementById('notifBtn').onclick=()=>toast('You are all caught up in this demo.');document.getElementById('menuBtn').onclick=()=>{let s=document.querySelector('.sidebar');s.style.display=s.style.display==='flex'?'none':'flex';s.style.position='fixed';s.style.zIndex='30';s.style.inset='0 auto 0 0';s.style.width='260px'};
function header(title,sub,button=''){return `<div class="page-head"><div><div class="eyebrow">NAMMAPREP · LEARN EVERY DAY</div><h1>${title}</h1><p>${sub}</p></div>${button}</div>`}function tag(s,cls=''){return `<span class="tag ${cls}">${esc(s)}</span>`}function item(title,desc,icon='▣',meta='',actions=''){return `<div class="list-item"><div class="item-icon">${icon}</div><div style="min-width:0;flex:1"><h3>${title}</h3><p>${desc}</p>${meta?`<div class="item-meta">${meta}</div>`:''}</div>${actions?`<div class="item-actions">${actions}</div>`:''}</div>`}function empty(title,desc){return `<div class="empty"><strong>${title}</strong>${desc}</div>`}function feature(icon,title,desc,p){return `<button class="feature" data-page="${p}"><div class="feature-icon">${icon}</div><strong>${title}</strong><small>${desc}</small></button>`}
function render(){navRender();let v=document.getElementById('view');let views={home:homePage,news:newsPage,current:currentPage,notes:notesPage,quizzes:quizzesPage,mock:mockPage,papers:papersPage,jobs:jobsPage,planner:plannerPage,bookmarks:bookmarksPage,admin:adminPage};v.innerHTML=(views[page]||homePage)()+`<div class="footer">NammaPrep · Demo application · Verify official sources before acting on recruitment notices.</div>`;}
function homePage(){let completed=plannerTasks.filter(t=>t.done).length;return `${header(lang==='kn'?'ನಮಸ್ಕಾರ! ನಿಮ್ಮ ತಯಾರಿ ಇಲ್ಲಿಂದ ಆರಂಭಿಸಿ.':'Welcome back, Aspirant!',lang==='kn'?'ನಿಮ್ಮ ಗುರಿಗೆ ಪ್ರತಿದಿನ ಒಂದು ಹೆಜ್ಜೆ ಹತ್ತಿರ.':'Your next step towards success starts here.',`<button class="btn secondary" data-page="planner">＋ Study plan</button>`)}<section class="hero"><div><div class="eyebrow">YOUR DAILY ADVANTAGE</div><h2>Small steps today.<br>Stronger results tomorrow.</h2><p>News, notes, quizzes and recruitment updates — all in one place, built for Karnataka and India’s competitive exams.</p><button class="btn" data-page="quizzes">Start today’s quiz&nbsp; →</button> <button class="btn secondary" data-page="notes">Explore notes</button></div><div class="hero-stats"><div class="hero-stat"><strong>${data.notes.length}</strong><span>Study notes</span></div><div class="hero-stat"><strong>${data.quizzes.length}</strong><span>Practice quizzes</span></div><div class="hero-stat"><strong>${completed}</strong><span>Goals done</span></div></div></section><div class="grid stats-grid"><div class="stat-card"><div class="stat-top"><span>Daily learning</span><span class="stat-icon">◷</span></div><strong>15 min</strong><small>Start with a short session</small></div><div class="stat-card"><div class="stat-top"><span>Practice library</span><span class="stat-icon">✓</span></div><strong>${data.quizzes.reduce((a,q)=>a+q.questions.length,0)}+</strong><small>Demo quiz questions</small></div><div class="stat-card"><div class="stat-top"><span>Saved resources</span><span class="stat-icon">☆</span></div><strong>${bookmarks.length}</strong><small>Items bookmarked</small></div><div class="stat-card"><div class="stat-top"><span>Target exams</span><span class="stat-icon">◎</span></div><strong>KPSC +</strong><small>Explore more exams</small></div></div><div class="section-title"><h2>Explore NammaPrep</h2><span class="muted">Your preparation toolkit</span></div><div class="grid feature-grid">${feature('▤','News & current affairs','Daily exam-focused updates','news')}${feature('▣','Study notes','Textbook-based learning','notes')}${feature('✓','Daily quizzes','Practice and improve','quizzes')}${feature('▧','Government jobs','Official recruitment links','jobs')}${feature('◫','Mock tests','Simulated exam practice','mock')}${feature('▤','PYQs & MQPs','Past and model papers','papers')}${feature('▦','Study planner','Track your syllabus','planner')}${feature('☆','Bookmarks','Your saved resources','bookmarks')}</div><div class="grid two-col"><div><div class="section-title"><h2>Latest learning notes</h2><a data-page="notes">View all →</a></div><div class="card item-list">${data.notes.slice(0,3).map(n=>item(esc(n.title),`${esc(n.subject)} · ${esc(n.source)}`,'▣',tag(n.level||'Foundation'),`<button class="text-link" data-action="open-note" data-id="${n.id}">Read</button>`)).join('')}</div></div><div><div class="section-title"><h2>Recruitment links</h2><a data-page="jobs">Explore jobs →</a></div><div class="card item-list">${data.jobs.slice(0,3).map(j=>item(esc(j.title),esc(j.org),'▧',tag('Official source','gray'),`<button class="text-link" data-action="open-job" data-id="${j.id}">View</button>`)).join('')}</div></div></div><div class="notice">Demo content is provided to demonstrate the app. Verify current affairs, paper authenticity, deadlines and eligibility using the linked official sources.</div>`}
function newsPage(){return `${header('Newspapers & News','Read authorized newspaper sources and concise exam-focused summaries.')}<div class="notice">Newspaper names belong to their respective publishers. This demo provides source links and sample summaries; it does not reproduce full e-paper content.</div><div class="section-title"><h2>Newspaper directory</h2></div><div class="grid four-col">${[['Prajavani','Kannada','https://www.prajavani.net/'],['Vijay Karnataka','Kannada','https://vijaykarnataka.com/'],['Deccan Herald','English','https://www.deccanherald.com/'],['The Hindu','English','https://www.thehindu.com/']].map((n,i)=>`<div class="card paper-card"><div class="paper-top"><div class="item-icon">▤</div>${tag(n[1])}</div><h3>${n[0]}</h3><p>Visit the publisher's official website for articles and authorized e-paper access.</p><a class="btn secondary" target="_blank" rel="noopener" href="${n[2]}">Open newspaper ↗</a></div>`).join('')}</div><div class="section-title"><h2>Exam-focused summaries</h2></div><div class="filters"><input id="newsFilter" placeholder="Search news summaries..."><select id="newsCategory"><option value="">All categories</option><option>Karnataka</option><option>Economy</option><option>Science</option><option>National</option></select></div><div class="card item-list" id="newsList">${newsItems(data.news)}</div>`}
function newsItems(items){return items.length?items.map(n=>item(esc(n.title),`${esc(n.summary)}<br><span class="muted">Source: ${esc(n.source)} · ${esc(n.date)}</span>`,'▤',tag(n.category||'Current Affairs')+tag((n.exams||[]).join(', '),'gray'),`<button class="text-link" data-action="bookmark" data-id="${n.id}" data-kind="news">☆ Save</button>`)).join(''):empty('No news found','Try another search or category.')}
function currentPage(){return `${header('Current Affairs','Daily, weekly and monthly revision for competitive exams.')}<div class="pill-tabs" id="currentTabs"><button class="active" data-current="Daily">Daily</button><button data-current="Weekly revision">Weekly revision</button><button data-current="Monthly revision">Monthly revision</button><button data-current="Karnataka">Karnataka</button><button data-current="National">National</button></div><div class="filters"><input id="currentSearch" placeholder="Search current affairs..."><select id="currentExam"><option value="">All exams</option><option>KPSC</option><option>KAS</option><option>UPSC</option><option>SSC</option></select></div><div class="card item-list" id="currentList">${newsItems(data.news)}</div><div class="notice">For production, publish only verified entries with a source URL, publication date and review status.</div>`}
function notesPage(){return `${header('Study Notes','Textbook-informed notes from Karnataka State Board, NCERT and trusted sources.',`<button class="btn" data-action="add-note">＋ Add note</button>`)}<div class="notice"><strong>Source-first learning.</strong> Use original explanations and link to official textbooks. Check reuse permissions before hosting textbook PDFs. <a href="https://textbooks.karnataka.gov.in/" target="_blank" rel="noopener">Karnataka textbooks ↗</a> · <a href="https://ncert.nic.in/textbook.php" target="_blank" rel="noopener">NCERT textbooks ↗</a></div><div class="filters"><input id="noteSearch" placeholder="Search notes, chapters or sources..."><select id="noteSubject"><option value="">All subjects</option>${['Polity','History','Geography','Karnataka GK','Economy','Science','Environment','Kannada Grammar','English Grammar','Mathematics','Reasoning','Computer Knowledge'].map(s=>`<option>${s}</option>`).join('')}</select><select id="noteSource"><option value="">All sources</option><option>Karnataka State Board</option><option>NCERT</option><option>Official government</option><option>Original NammaPrep</option></select></div><div class="grid three-col" id="notesGrid">${noteCards(data.notes)}</div>`}
function noteCards(items){return items.length?items.map(n=>`<article class="card paper-card"><div class="paper-top">${tag(n.subject)}<button class="text-link" data-action="bookmark" data-id="${n.id}" data-kind="note">☆ Save</button></div><h3>${esc(n.title)}</h3><p>${esc(n.summary)}</p><div class="item-meta">${tag(n.level||'Foundation','gray')}${tag(n.language||'English','gray')}</div><p><strong>Source:</strong> ${esc(n.source)}</p><button class="btn secondary" data-action="open-note" data-id="${n.id}">Read notes →</button></article>`).join(''):empty('No notes found','Try a different subject or keyword.')}
function quizzesPage(){if(quizState)return quizRunner();return `${header('Daily Quizzes','Build confidence with quick practice and clear explanations.')}<div class="grid three-col">${data.quizzes.map(q=>`<div class="card paper-card"><div class="paper-top">${tag(q.subject)}${tag(`${q.questions.length} questions`,'gray')}</div><h3>${esc(q.title)}</h3><p>Exam: ${esc(q.exam)} · MCQ practice with instant scoring and explanations.</p><div class="item-meta">${tag('Practice mode')}${tag('Answer review')}</div><button class="btn" data-action="start-quiz" data-id="${q.id}">Start quiz →</button></div>`).join('')}</div><div class="notice">These are sample practice questions for the demo. Review and validate the answer key before using quizzes for real exam preparation.</div>`}
function quizRunner(){let q=data.quizzes.find(x=>x.id===quizState.id);if(!q)return '';let current=q.questions[quizState.index];return `${header(esc(q.title),`Question ${quizState.index+1} of ${q.questions.length} · ${esc(q.subject)}`)}<div class="card" style="max-width:760px;margin:auto"><div class="progress"><span style="width:${(quizState.index+1)/q.questions.length*100}%"></span></div><h2 style="font-size:21px;margin-top:24px">${esc(current.q)}</h2><div>${current.opts.map((o,i)=>`<button class="quiz-option ${quizState.answers[quizState.index]===i?'selected':''}" data-action="answer" data-id="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><div style="display:flex;justify-content:space-between;margin-top:22px"><button class="btn secondary" data-action="quiz-prev" ${quizState.index===0?'disabled':''}>← Previous</button>${quizState.index===q.questions.length-1?'<button class="btn" data-action="submit-quiz">Submit quiz</button>':'<button class="btn" data-action="quiz-next">Next →</button>'}</div>${quizState.submitted?`<div class="notice">Quiz completed. Score: ${quizState.score}/${q.questions.length}. Review your answers below.</div>${q.questions.map((x,i)=>`<div class="list-item"><div style="flex:1"><h3>${i+1}. ${esc(x.q)}</h3><p>Correct answer: ${esc(x.opts[x.a])}</p><p>${esc(x.exp)}</p></div>${quizState.answers[i]===x.a?tag('Correct'):tag('Review','amber')}</div>`).join('')}`:''}</div>`}
function mockPage(){return `${header('Mock Tests','Prepare under timed conditions and understand your performance.')}<div class="grid three-col"><div class="card paper-card"><div class="item-icon">◫</div><h3>General Studies Starter</h3><p>5 questions · Sample test · No negative marking</p><button class="btn" data-action="start-quiz" data-id="1">Start sample test</button></div><div class="card paper-card"><div class="item-icon">◎</div><h3>Karnataka GK Quick Test</h3><p>3 questions · Sample test · Instant feedback</p><button class="btn" data-action="start-quiz" data-id="2">Start sample test</button></div><div class="card paper-card"><div class="item-icon">▦</div><h3>Full-length test builder</h3><p>Admin-created test templates can be connected here with verified exam patterns.</p><button class="btn secondary" data-page="admin">Open admin →</button></div></div><div class="notice">The available tests are short demonstration quizzes, not full-length official exam simulations.</div>`}
function papersPage(){return `${header('PYQs & MQPs','Find previous-year papers and model practice sets by exam.')}<div class="notice">Only verified and authorized papers should be uploaded. Sample entries below are model resources, not official previous-year papers.</div><div class="filters"><input id="paperSearch" placeholder="Search papers..."><select id="paperExam"><option value="">All exams</option><option>KPSC</option><option>UPSC</option><option>SSC</option><option>PDO</option></select><select id="paperType"><option value="">All types</option><option>PYQ</option><option>MQP</option></select></div><div class="grid three-col" id="papersGrid">${paperCards(data.papers)}</div>`}
function paperCards(items){return items.length?items.map(p=>`<div class="card paper-card"><div class="paper-top">${tag(p.type)}${tag(p.year,'gray')}</div><h3>${esc(p.title)}</h3><p>${esc(p.exam)} · ${esc(p.subject)} · ${esc(p.language)}</p><p>${esc(p.description)}</p><button class="btn secondary" data-action="paper-info" data-id="${p.id}">View details →</button></div>`).join(''):empty('No papers found','Try another filter.')}
function jobsPage(){return `${header('Government Jobs','Track recruitment updates through official sources.',`<button class="btn" data-action="add-job">＋ Add notification</button>`)}<div class="notice">This demo does not verify live vacancies. Always confirm eligibility, dates and application details on the recruiting authority’s official website.</div><div class="filters"><input id="jobSearch" placeholder="Search organization or recruitment..."><select id="jobStatus"><option value="">All statuses</option><option>Open</option><option>Closing soon</option><option>Upcoming</option><option>Verify official notice</option></select></div><div class="grid two-col" id="jobsGrid">${jobCards(data.jobs)}</div>`}
function jobCards(items){return items.length?items.map(j=>`<div class="card paper-card"><div class="paper-top">${tag(j.status,j.status==='Open'?'':'amber')}<span class="muted" style="font-size:11px">Official link</span></div><h3>${esc(j.title)}</h3><p>${esc(j.org)}</p><p>${esc(j.description)}</p><div class="item-meta">${tag('Deadline: '+j.deadline,'gray')}</div><div style="display:flex;gap:8px;margin-top:auto"><a class="btn" href="${esc(j.link)}" target="_blank" rel="noopener">Official website ↗</a><button class="btn secondary" data-action="bookmark" data-id="${j.id}" data-kind="job">☆ Save</button></div></div>`).join(''):empty('No notifications found','Try another search.')}
function plannerPage(){return `${header('Study Planner','Set small, realistic goals and track your progress.',`<button class="btn" data-action="add-task">＋ Add task</button>`)}<div class="grid two-col"><div class="card"><div class="section-title" style="margin-top:0"><h2>Today's goals</h2><span>${plannerTasks.filter(t=>t.done).length}/${plannerTasks.length} done</span></div><div class="progress"><span style="width:${plannerTasks.length?plannerTasks.filter(t=>t.done).length/plannerTasks.length*100:0}%"></span></div><div class="item-list" style="margin-top:12px">${plannerTasks.length?plannerTasks.map(t=>`<div class="list-item"><input type="checkbox" ${t.done?'checked':''} data-action="toggle-task" data-id="${t.id}" style="margin-top:4px"><div style="flex:1"><h3 style="${t.done?'text-decoration:line-through;color:#7b8980':''}">${esc(t.title)}</h3><p>${esc(t.subject||'General')} · ${esc(t.duration||'25 min')}</p></div><button class="text-link" data-action="delete-task" data-id="${t.id}">Remove</button></div>`).join(''):empty('Your plan starts here','Add your first task and build a consistent routine.')}</div></div><div class="card"><h2 style="margin-top:0">A balanced study session</h2>${[['Current affairs','15 minutes'],['One textbook topic','30 minutes'],['Practice quiz','15 minutes'],['Review mistakes','10 minutes']].map((x,i)=>`<div class="progress-row"><span>${x[0]}</span><strong>${x[1]}</strong></div><div class="progress"><span style="width:${[75,60,45,35][i]}%"></span></div>`).join('')}<p class="muted" style="font-size:12px;margin-top:18px">Suggested routine — adjust it to your own schedule.</p></div></div>`}
function bookmarksPage(){let all=[...data.news.map(x=>({...x,kind:'news'})),...data.notes.map(x=>({...x,kind:'note'})),...data.jobs.map(x=>({...x,kind:'job'})),...data.papers.map(x=>({...x,kind:'paper'}))];let saved=bookmarks.map(b=>({...all.find(x=>String(x.id)===String(b.id)&&x.kind===b.kind),...b})).filter(x=>x.title);return `${header('Bookmarks','Your saved news, notes, jobs and practice resources.')}<div class="card item-list">${saved.length?saved.map(x=>item(esc(x.title),`${esc(x.kind)} · ${esc(x.summary||x.description||x.org||x.subject||'Saved resource')}`,'☆',tag(x.kind),`<button class="text-link" data-action="remove-bookmark" data-id="${x.id}" data-kind="${x.kind}">Remove</button>`)).join(''):empty('No bookmarks yet','Use the ☆ Save action on a resource to keep it here.')}</div>`}
function adminPage(){return `${header('Admin Dashboard','Manage demo content and prepare the platform for verified publishing.')}<div class="notice">Demo mode: changes are saved in this browser only. Connect Supabase and configure secure roles before using this as a live admin system.</div><div class="grid four-col">${[['News summaries',data.news.length],['Study notes',data.notes.length],['Quizzes',data.quizzes.length],['Job links',data.jobs.length]].map(x=>`<div class="stat-card"><small>${x[0]}</small><strong>${x[1]}</strong><span class="muted">Records</span></div>`).join('')}</div><div class="section-title"><h2>Content management</h2></div><div class="grid three-col"><button class="feature" data-action="add-note"><div class="feature-icon">▣</div><strong>Add study note</strong><small>Create an original note with source details.</small></button><button class="feature" data-action="add-news"><div class="feature-icon">▤</div><strong>Add news summary</strong><small>Add a verified summary and source.</small></button><button class="feature" data-action="add-job"><div class="feature-icon">▧</div><strong>Add job notification</strong><small>Save official recruitment links.</small></button><button class="feature" data-action="add-quiz"><div class="feature-icon">✓</div><strong>Add quiz</strong><small>Create a small practice quiz.</small></button><button class="feature" data-action="export-data"><div class="feature-icon">⇩</div><strong>Export demo data</strong><small>Download a JSON backup.</small></button><button class="feature" data-action="reset-demo"><div class="feature-icon">↻</div><strong>Reset demo</strong><small>Restore the original sample records.</small></button></div><div class="section-title"><h2>Content records</h2></div><div class="card item-list">${data.notes.slice(0,5).map(n=>item(esc(n.title),`${esc(n.subject)} · ${esc(n.source)}`,'▣',tag('Note'),`<button class="text-link" data-action="delete-record" data-kind="note" data-id="${n.id}">Delete</button>`)).join('')}</div>`}
function renderSearch(q){let low=q.toLowerCase(),v=document.getElementById('view');let groups=[['Notes',data.notes.filter(x=>(x.title+' '+x.summary+' '+x.subject).toLowerCase().includes(low)),'notes'],['News',data.news.filter(x=>(x.title+' '+x.summary+' '+x.category).toLowerCase().includes(low)),'news'],['Jobs',data.jobs.filter(x=>(x.title+' '+x.org+' '+x.description).toLowerCase().includes(low)),'jobs'],['Papers',data.papers.filter(x=>(x.title+' '+x.exam+' '+x.subject).toLowerCase().includes(low)),'papers']];v.innerHTML=header('Search results',`Results for “${esc(q)}”`)+groups.map(([title,items,p])=>`<div class="section-title"><h2>${title}</h2><a data-page="${p}">View section →</a></div><div class="card item-list">${items.length?items.map(x=>item(esc(x.title),esc(x.summary||x.description||x.org||x.subject||''),'⌕',tag(title))).join(''):empty('No matching '+title.toLowerCase(),'')}</div>`).join('')}
function openModal(title,body,foot=''){let m=document.getElementById('modal');m.innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="close" data-action="close-modal">✕</button></div>${body}${foot}`;document.getElementById('modalBackdrop').classList.add('show')};function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')};document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
function action(a,id,kind){if(a==='close-modal'){closeModal();return}if(a==='bookmark'){let b={id:Number(id),kind};let idx=bookmarks.findIndex(x=>x.id===b.id&&x.kind===b.kind);if(idx>=0)toast('Already in bookmarks');else{bookmarks.push(b);localStorage.setItem('np-bookmarks',JSON.stringify(bookmarks));toast('Saved to bookmarks')}render();return}if(a==='remove-bookmark'){bookmarks=bookmarks.filter(x=>!(x.id===Number(id)&&x.kind===kind));localStorage.setItem('np-bookmarks',JSON.stringify(bookmarks));render();toast('Bookmark removed');return}if(a==='open-note'){let n=data.notes.find(x=>x.id===Number(id));if(n)openModal(esc(n.title),`<div class="item-meta">${tag(n.subject)}${tag(n.language||'English','gray')}</div><p>${esc(n.summary)}</p><p><strong>Source:</strong> ${esc(n.source)}</p><p><strong>Exam relevance:</strong> ${esc((n.tags||[]).join(', ')||'Add verified exam tags')}</p><div class="notice">This is a demonstration note. Add verified chapter/page references and reviewed explanations before publishing.</div><button class="btn" data-action="bookmark" data-id="${n.id}" data-kind="note">☆ Save note</button>`);return}if(a==='open-job'){let j=data.jobs.find(x=>x.id===Number(id));if(j)openModal(esc(j.title),`<p><strong>${esc(j.org)}</strong></p><p>${esc(j.description)}</p><p>Status: ${esc(j.status)}<br>Deadline: ${esc(j.deadline)}</p><a class="btn" href="${esc(j.link)}" target="_blank" rel="noopener">Open official source ↗</a>`);return}if(a==='paper-info'){let p=data.papers.find(x=>x.id===Number(id));if(p)openModal(esc(p.title),`<p>${esc(p.description)}</p><p><strong>Exam:</strong> ${esc(p.exam)}<br><strong>Type:</strong> ${esc(p.type)}<br><strong>Year:</strong> ${esc(p.year)}<br><strong>Subject:</strong> ${esc(p.subject)}</p><div class="notice">No PDF is attached to this demo entry. Add a verified and authorized source in the admin dashboard.</div>`);return}if(a==='start-quiz'){quizState={id:Number(id),index:0,answers:{},submitted:false,score:0};go('quizzes');return}if(a==='answer'){if(!quizState||quizState.submitted)return;quizState.answers[quizState.index]=Number(id);render();return}if(a==='quiz-next'){let q=data.quizzes.find(x=>x.id===quizState.id);quizState.index=Math.min(q.questions.length-1,quizState.index+1);render();return}if(a==='quiz-prev'){quizState.index=Math.max(0,quizState.index-1);render();return}if(a==='submit-quiz'){let q=data.quizzes.find(x=>x.id===quizState.id);quizState.score=q.questions.reduce((s,x,i)=>s+(quizState.answers[i]===x.a?1:0),0);quizState.submitted=true;render();toast('Quiz submitted');return}if(a==='add-note'){openModal('Add study note',`<form id="addNoteForm"><div class="field"><label>Note title</label><input name="title" required placeholder="e.g. Karnataka Geography — Rivers"></div><div class="field"><label>Subject</label><select name="subject"><option>Polity</option><option>History</option><option>Geography</option><option>Karnataka GK</option><option>Economy</option><option>Science</option><option>Environment</option><option>Kannada Grammar</option><option>English Grammar</option><option>Mathematics</option><option>Reasoning</option><option>Computer Knowledge</option></select></div><div class="field"><label>Source / textbook reference</label><input name="source" required placeholder="Textbook, class, chapter or official URL"></div><div class="field"><label>Language</label><select name="language"><option>English</option><option>Kannada</option><option>Kannada + English</option></select></div><div class="field"><label>Summary / original explanation</label><textarea name="summary" required placeholder="Write an original explanation..."></textarea></div><div class="field"><label>Exam tags (comma separated)</label><input name="tags" placeholder="KPSC, KAS, UPSC"></div><button class="btn" type="submit">Save note</button></form>`);document.getElementById('addNoteForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.notes.unshift({id:Date.now(),title:f.get('title'),subject:f.get('subject'),source:f.get('source'),language:f.get('language'),summary:f.get('summary'),level:'Admin added',tags:String(f.get('tags')).split(',').map(s=>s.trim()).filter(Boolean),demo:false});save();closeModal();go('notes');toast('Note added in this browser');};return}if(a==='add-news'){openModal('Add news summary',`<form id="addNewsForm"><div class="field"><label>Headline</label><input name="title" required></div><div class="field"><label>Source name</label><input name="source" required placeholder="Official source or publisher"></div><div class="field"><label>Source URL</label><input name="url" type="url" placeholder="https://..."></div><div class="field"><label>Category</label><select name="category"><option>Karnataka</option><option>National</option><option>International</option><option>Economy</option><option>Science</option><option>Environment</option><option>Sports</option></select></div><div class="field"><label>Summary</label><textarea name="summary" required></textarea></div><button class="btn">Save summary</button></form>`);document.getElementById('addNewsForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.news.unshift({id:Date.now(),title:f.get('title'),source:f.get('source'),url:f.get('url'),category:f.get('category'),summary:f.get('summary'),kn:'',date:new Date().toISOString().slice(0,10),exams:['KPSC'],demo:false});save();closeModal();go('news');toast('Summary added');};return}if(a==='add-job'){openModal('Add recruitment notification',`<form id="addJobForm"><div class="field"><label>Recruitment title</label><input name="title" required></div><div class="field"><label>Organization</label><input name="org" required></div><div class="field"><label>Official website / notification URL</label><input name="link" type="url" required placeholder="https://..."></div><div class="field"><label>Deadline (as published)</label><input name="deadline" placeholder="Verify official notification"></div><div class="field"><label>Description</label><textarea name="description" required></textarea></div><button class="btn">Save notification</button></form>`);document.getElementById('addJobForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.jobs.unshift({id:Date.now(),title:f.get('title'),org:f.get('org'),link:f.get('link'),deadline:f.get('deadline')||'Check official notification',description:f.get('description'),status:'Verify official notice',demo:false});save();closeModal();go('jobs');toast('Notification added');};return}if(a==='add-task'){openModal('Add study task',`<form id="taskForm"><div class="field"><label>Task</label><input name="title" required placeholder="e.g. Revise Fundamental Rights"></div><div class="field"><label>Subject</label><input name="subject" placeholder="Polity"></div><div class="field"><label>Duration</label><select name="duration"><option>15 min</option><option selected>25 min</option><option>30 min</option><option>45 min</option><option>60 min</option></select></div><button class="btn">Add to plan</button></form>`);document.getElementById('taskForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);plannerTasks.push({id:Date.now(),title:f.get('title'),subject:f.get('subject')||'General',duration:f.get('duration'),done:false});localStorage.setItem('np-tasks',JSON.stringify(plannerTasks));closeModal();render();toast('Study task added');};return}if(a==='toggle-task'){let t=plannerTasks.find(x=>x.id===Number(id));if(t){t.done=!t.done;localStorage.setItem('np-tasks',JSON.stringify(plannerTasks));render()}return}if(a==='delete-task'){plannerTasks=plannerTasks.filter(x=>x.id!==Number(id));localStorage.setItem('np-tasks',JSON.stringify(plannerTasks));render();return}if(a==='add-quiz'){openModal('Create quiz',`<form id="quizForm"><div class="field"><label>Quiz title</label><input name="title" required></div><div class="field"><label>Subject</label><input name="subject" required></div><div class="field"><label>Question</label><input name="q" required></div><div class="field"><label>Option A</label><input name="a" required></div><div class="field"><label>Option B</label><input name="b" required></div><div class="field"><label>Option C</label><input name="c" required></div><div class="field"><label>Option D</label><input name="d" required></div><div class="field"><label>Correct option</label><select name="answer"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div><div class="field"><label>Explanation</label><textarea name="exp"></textarea></div><button class="btn">Create quiz</button></form>`);document.getElementById('quizForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.quizzes.unshift({id:Date.now(),title:f.get('title'),subject:f.get('subject'),exam:'Custom',questions:[{q:f.get('q'),opts:[f.get('a'),f.get('b'),f.get('c'),f.get('d')],a:Number(f.get('answer')),exp:f.get('exp')||'Add a verified explanation.'}],demo:false});save();closeModal();go('quizzes');toast('Quiz created');};return}if(a==='export-data'){let blob=new Blob([JSON.stringify({data,plannerTasks,bookmarks},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='nammaprep-demo-backup.json';link.click();URL.revokeObjectURL(url);toast('Backup downloaded');return}if(a==='reset-demo'){if(confirm('Reset sample content? This will replace locally saved content.')){data=structuredClone(initial);save();go('admin');toast('Demo content reset')}return}if(a==='delete-record'){if(confirm('Delete this note from this browser?')){if(kind==='note')data.notes=data.notes.filter(x=>x.id!==Number(id));save();render();toast('Record deleted')}return}}
// Live section filters
document.addEventListener('input',e=>{if(e.target.id==='noteSearch'||e.target.id==='noteSubject'||e.target.id==='noteSource'){let q=(document.getElementById('noteSearch')?.value||'').toLowerCase(),s=document.getElementById('noteSubject')?.value||'',src=document.getElementById('noteSource')?.value||'';let items=data.notes.filter(n=>(n.title+' '+n.summary+' '+n.subject+' '+n.source).toLowerCase().includes(q)&&(!s||n.subject===s)&&(!src||n.source.toLowerCase().includes(src.toLowerCase().split(' ')[0])));document.getElementById('notesGrid').innerHTML=noteCards(items)}if(e.target.id==='newsFilter'||e.target.id==='newsCategory'){let q=(document.getElementById('newsFilter')?.value||'').toLowerCase(),c=document.getElementById('newsCategory')?.value||'';document.getElementById('newsList').innerHTML=newsItems(data.news.filter(n=>(n.title+' '+n.summary).toLowerCase().includes(q)&&(!c||n.category===c)))}if(e.target.id==='currentSearch'||e.target.id==='currentExam'){let q=(document.getElementById('currentSearch')?.value||'').toLowerCase(),x=document.getElementById('currentExam')?.value||'';document.getElementById('currentList').innerHTML=newsItems(data.news.filter(n=>(n.title+' '+n.summary).toLowerCase().includes(q)&&(!x||(n.exams||[]).includes(x))))}if(e.target.id==='paperSearch'||e.target.id==='paperExam'||e.target.id==='paperType'){let q=(document.getElementById('paperSearch')?.value||'').toLowerCase(),x=document.getElementById('paperExam')?.value||'',t=document.getElementById('paperType')?.value||'';document.getElementById('papersGrid').innerHTML=paperCards(data.papers.filter(p=>(p.title+' '+p.exam+' '+p.subject).toLowerCase().includes(q)&&(!x||p.exam.includes(x))&&(!t||p.type===t)))}if(e.target.id==='jobSearch'||e.target.id==='jobStatus'){let q=(document.getElementById('jobSearch')?.value||'').toLowerCase(),s=document.getElementById('jobStatus')?.value||'';document.getElementById('jobsGrid').innerHTML=jobCards(data.jobs.filter(j=>(j.title+' '+j.org+' '+j.description).toLowerCase().includes(q)&&(!s||j.status===s)))}});
document.addEventListener('click',e=>{let t=e.target.closest('[data-current]');if(t){document.querySelectorAll('[data-current]').forEach(b=>b.classList.remove('active'));t.classList.add('active');let k=t.dataset.current;let arr=k==='Karnataka'?data.news.filter(n=>n.category==='Karnataka'):k==='National'?data.news.filter(n=>n.category==='National'):data.news;document.getElementById('currentList').innerHTML=newsItems(arr)}});
render();
</script></body></html>
